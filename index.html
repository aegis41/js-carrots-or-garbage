<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrots or Garbage</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Home Screen, Game Screen, Game Over, etc. -->
        <div id="home-screen">
            <h1>Carrots or Garbage</h1>
            <button id="start-game">Start New Game</button>
            <button id="continue-game">Continue Game</button>
            <button id="clear-progress">Clear Progress</button>
            <button id="view-stats">View Statistics</button>
        </div>

        <div id="game-screen" style="display: none;">
            <h2>Place Your Bet</h2>
            <div id="bet-amounts"></div>
            <button id="bet-carrots">Bet Carrots</button>
            <button id="bet-garbage">Bet Garbage</button>
            <div id="result-display"></div>
        </div>
        
        <!-- Additional screens will go here -->
    </div>
    <script src="app.js"></script>
</body>
</html>
